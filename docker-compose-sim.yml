services:
  postgres:
    image: postgres:16
    container_name: volttron-postgres
    environment:
      POSTGRES_DB: volttron
      POSTGRES_USER: volttron
      POSTGRES_PASSWORD: ec0l0ng
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volttron -d volttron"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - automation

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    environment:
      TZ: America/Los_Angeles
    volumes:
      - ./homeassistant-config:/config
    ports:
      - "8123:8123"
    restart: unless-stopped
    networks:
      - automation

  volttron1:
    container_name: volttron1
    hostname: volttron1
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: eclipsevolttron/volttron:test-build
    ports:
      - "8443:8443"
      - "22916:22916"
    volumes:
      - ./platform_config.yml:/platform_config.yml:ro
      - ./agents/EnergyplusAgent:/home/volttron/energyplus-agent
      - ./configs:/home/volttron/configs
      - volttron1-volume:/home/volttron/db
    environment:
      CONFIG: /home/volttron/configs
      LOCAL_USER_ID: "1000"
      TZ: America/Los_Angeles
      PYTHONPATH: /code/volttron
    depends_on:
      postgres:
        condition: service_healthy
      homeassistant:
        condition: service_started
    networks:
      - automation

volumes:
  volttron1-volume:
    name: volttron1-data
  postgres-data:
    name: volttron-postgres-data

networks:
  automation:
    name: volttron-automation
