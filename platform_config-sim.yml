# Minimal platform for the EnergyPlus simulation and PostgreSQL historian.
config:
  vip-address: tcp://0.0.0.0:22916
  bind-web-address: https://0.0.0.0:8443
  volttron-central-address: https://0.0.0.0:8443
  instance-name: volttron1
  message-bus: zmq

agents:
  platform.historian:
    source: $VOLTTRON_ROOT/services/core/SQLHistorian
    config: $CONFIG/historian.config
    tag: historian

  energyplus:
    source: /home/volttron/energyplus-agent
    config: $CONFIG/energyplus.config
    tag: energyplus
